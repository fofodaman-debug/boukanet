<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Police Radio</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>

<body>
  <div class="container">
    <h1>Police Radio Text-to-Speech</h1>
    <p>Type your message below and press "Transmit" to hear it with a police siren.</p>
    <textarea id="text-input" placeholder="ادخل النص هنا..."></textarea>
    <select id="language-select">
      <option value="ar-SA">Arabic</option>
      <option value="en-US">English</option>
      <option value="es-ES">Spanish</option>
      <option value="fr-FR">French</option>
      <option value="de-DE">German</option>
    </select>
    <button id="speak-button">Transmit</button>
  </div>
  <audio id="police-siren" src="https://fofodaman-debug.github.io/boukanet/police-siren.mp3" preload="auto"></audio>
  <script src="script.js"></script>
</body>

</html>
